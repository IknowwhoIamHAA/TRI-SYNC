name = "tri-sync-worker"
main = "src/index.js"
compatibility_date = "2026-08-29"

# ---------------------------------------------------------------------------
# Top-level (dev / local preview) — uses placeholder KV ids.
# Override with real preview namespace ids for local `wrangler dev`.
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "ISSUED_KEYS"
id = "REPLACE_WITH_YOUR_PREVIEW_ISSUED_KEYS_KV_NAMESPACE_ID"

[[kv_namespaces]]
binding = "MARKETING_CONTACTS"
id = "REPLACE_WITH_YOUR_PREVIEW_MARKETING_CONTACTS_KV_NAMESPACE_ID"

# ---------------------------------------------------------------------------
# Staging environment
# ---------------------------------------------------------------------------
[env.staging]
name = "tri-sync-worker-staging"

[[env.staging.kv_namespaces]]
binding = "ISSUED_KEYS"
id = "REPLACE_WITH_YOUR_STAGING_ISSUED_KEYS_KV_NAMESPACE_ID"

[[env.staging.kv_namespaces]]
binding = "MARKETING_CONTACTS"
id = "REPLACE_WITH_YOUR_STAGING_MARKETING_CONTACTS_KV_NAMESPACE_ID"

# ---------------------------------------------------------------------------
# Production environment
# ---------------------------------------------------------------------------
[env.production]
name = "trisync-license-worker"
# Routes use api.trisync.dev to avoid the Cloudflare Pages custom-domain
# capture that intercepts all traffic on trisync.dev before Worker routes can
# match.  Required one-time DNS setup in the Cloudflare dashboard:
#   Add a CNAME record: api.trisync.dev → trisync-license-worker.<account>.workers.dev
#   (proxied / orange-cloud)
# Also update the Stripe webhook endpoint to https://api.trisync.dev/webhook.
routes = [
  { pattern = "api.trisync.dev/*", zone_name = "trisync.dev" },
]

[[env.production.kv_namespaces]]
binding = "ISSUED_KEYS"
id = "513255134bf44c74882832e17c6eed30"

[[env.production.kv_namespaces]]
binding = "MARKETING_CONTACTS"
id = "4e6e64d6c4ee413591a2911fc2f1e4b3"

