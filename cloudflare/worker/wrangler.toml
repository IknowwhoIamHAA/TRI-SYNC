name = "tri-sync-worker"
main = "src/index.js"
compatibility_date = "2024-04-10"

# ---------------------------------------------------------------------------
# Top-level (dev / local preview) — uses placeholder KV ids.
# Override with real preview namespace ids for local `wrangler dev`.
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "ISSUED_KEYS"
id = "REPLACE_WITH_YOUR_PREVIEW_ISSUED_KEYS_KV_NAMESPACE_ID"

[[kv_namespaces]]
binding = "MARKETING_CONTACTS"
id = "REPLACE_WITH_YOUR_PREVIEW_MARKETING_CONTACTS_KV_NAMESPACE_ID"

# ---------------------------------------------------------------------------
# Staging environment
#
# Deploy: wrangler deploy --env staging
# Secrets: wrangler secret put STRIPE_WEBHOOK_SECRET --env staging
#          wrangler secret put STRIPE_API_KEY         --env staging
#          wrangler secret put RESEND_API_KEY         --env staging
#          wrangler secret put RESEND_FROM_EMAIL      --env staging
#          wrangler secret put ADMIN_SECRET           --env staging
#          wrangler secret put MARKETING_API_KEY      --env staging
# ---------------------------------------------------------------------------
[env.staging]
name = "tri-sync-worker-staging"

[[env.staging.kv_namespaces]]
binding = "ISSUED_KEYS"
id = "REPLACE_WITH_YOUR_STAGING_ISSUED_KEYS_KV_NAMESPACE_ID"

[[env.staging.kv_namespaces]]
binding = "MARKETING_CONTACTS"
id = "REPLACE_WITH_YOUR_STAGING_MARKETING_CONTACTS_KV_NAMESPACE_ID"

# ---------------------------------------------------------------------------
# Production environment
#
# Deploy: wrangler deploy --env production
# Secrets: wrangler secret put STRIPE_WEBHOOK_SECRET --env production
#          wrangler secret put STRIPE_API_KEY         --env production
#          wrangler secret put RESEND_API_KEY         --env production
#          wrangler secret put RESEND_FROM_EMAIL      --env production
#          wrangler secret put ADMIN_SECRET           --env production
#          wrangler secret put MARKETING_API_KEY      --env production
# ---------------------------------------------------------------------------
[env.production]
name = "trisync-license-worker"
# Routes use api.trisync.dev to avoid the Cloudflare Pages custom-domain
# capture that intercepts all traffic on trisync.dev before Worker routes can
# match.  Required one-time DNS setup in the Cloudflare dashboard:
#   Add a CNAME record: api.trisync.dev → trisync-license-worker.<account>.workers.dev
#   (proxied / orange-cloud)
# Also update the Stripe webhook endpoint to https://api.trisync.dev/webhook.
routes = [
  { pattern = "api.trisync.dev/marketing/*", zone_name = "trisync.dev" },
  { pattern = "api.trisync.dev/health",      zone_name = "trisync.dev" },
  { pattern = "api.trisync.dev/validate",    zone_name = "trisync.dev" },
  { pattern = "api.trisync.dev/webhook",     zone_name = "trisync.dev" },
]

[[env.production.kv_namespaces]]
binding = "ISSUED_KEYS"
id = "REPLACE_WITH_YOUR_PRODUCTION_ISSUED_KEYS_KV_NAMESPACE_ID"

[[env.production.kv_namespaces]]
binding = "MARKETING_CONTACTS"
id = "REPLACE_WITH_YOUR_PRODUCTION_MARKETING_CONTACTS_KV_NAMESPACE_ID"
