[package]
name = "tri-sync"
version = "1.0.0"
edition = "2024"
description = "A local‑first deterministic runtime for reproducible workflows, automation, and AI auditing. Provides canonical JSON encoding, a binary state map, multi‑tenant isolation, and deterministic replay."
license = "MIT"
repository = "https://github.com/IknowwhoIamHAA/TRI-SYNC"

[dependencies]
clap = { version = "4.5.16", features = ["derive"] }
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.127"
sha2 = "0.10.8"
fs2 = "0.4.3"
